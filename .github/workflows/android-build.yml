name: COMICKO Android Build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-music-baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout COMICKO
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract music source
        shell: bash
        run: |
          set -euo pipefail
          test -f Velune-main.zip || { echo "::error::Velune-main.zip is missing from repository root"; exit 1; }
          mkdir -p _extract/music
          unzip -q Velune-main.zip -d _extract/music
          ROOT="$(find _extract/music -type d -name buildSrc -prune -o -type f -name settings.gradle.kts -print | head -n 1 | xargs -r dirname)"
          if [ -z "$ROOT" ]; then ROOT="$(find _extract/music -type d -name buildSrc -prune -o -type f -name settings.gradle -print | head -n 1 | xargs -r dirname)"; fi
          test -n "$ROOT" || { echo "::error::Could not locate the root music Gradle project inside Velune-main.zip"; exit 1; }
          mkdir -p music
          cp -a "$ROOT"/. music/
          echo "Extracted music project from: $ROOT"
          test -f music/settings.gradle.kts
          test -f music/gradle/libs.versions.toml

      - name: Build music baseline APK
        working-directory: music
        run: |
          set -euo pipefail
          curl -fsSL https://services.gradle.org/distributions/gradle-9.3.1-bin.zip -o "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          # AGP's per-app language task expects this file when generateLocaleConfig=true.
          mkdir -p app/src/main/res
          if [ ! -f app/src/main/res/resources.properties ]; then
            printf 'unqualifiedResLocale=en\n' > app/src/main/res/resources.properties
          fi
          "$RUNNER_TEMP/gradle-9.3.1/bin/gradle" :app:assembleUniversalDebug --no-daemon

      - name: Upload music baseline APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comicko-music-baseline
          path: music/app/build/outputs/apk/universal/debug/*.apk
          if-no-files-found: ignore

  build-manga-baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout COMICKO
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract manga source
        shell: bash
        run: |
          set -euo pipefail
          test -f yokai-master.zip || { echo "::error::yokai-master.zip is missing from repository root"; exit 1; }
          mkdir -p _extract/manga
          unzip -q yokai-master.zip -d _extract/manga
          # The archive has a nested buildSrc/settings.gradle.kts; explicitly skip buildSrc.
          ROOT="$(find _extract/manga -type d -name buildSrc -prune -o -type f -name settings.gradle.kts -print | head -n 1 | xargs -r dirname)"
          if [ -z "$ROOT" ]; then ROOT="$(find _extract/manga -type d -name buildSrc -prune -o -type f -name settings.gradle -print | head -n 1 | xargs -r dirname)"; fi
          test -n "$ROOT" || { echo "::error::Could not locate the root manga Gradle project inside yokai-master.zip"; exit 1; }
          mkdir -p manga
          cp -a "$ROOT"/. manga/
          echo "Extracted manga project from: $ROOT"
          test -f manga/settings.gradle.kts
          test -f manga/gradle/androidx.versions.toml
          test -f manga/buildSrc/build.gradle.kts

      - name: Build manga baseline APK
        working-directory: manga
        run: |
          set -euo pipefail
          curl -fsSL https://services.gradle.org/distributions/gradle-8.14.4-bin.zip -o "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/gradle-8.14.4/bin/gradle" :app:assembleStandardDebug --no-daemon

      - name: Upload manga baseline APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comicko-manga-baseline
          path: |
            manga/app/build/outputs/apk/standard/debug/*.apk
            manga/app/build/outputs/apk/standard/debug/*/*.apk
          if-no-files-found: ignore


  integration-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout COMICKO
        uses: actions/checkout@v4

      - name: Extract both projects and map integration points
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _audit/music _audit/manga
          unzip -q Velune-main.zip -d _audit/music
          unzip -q yokai-master.zip -d _audit/manga
          MUSIC_ROOT="$(find _audit/music -type d -name buildSrc -prune -o -type f -name settings.gradle.kts -print | head -n 1 | xargs -r dirname)"
          MANGA_ROOT="$(find _audit/manga -type d -name buildSrc -prune -o -type f -name settings.gradle.kts -print | head -n 1 | xargs -r dirname)"
          test -n "$MUSIC_ROOT"
          test -n "$MANGA_ROOT"
          python3 - "$MUSIC_ROOT" "$MANGA_ROOT" <<'PY'
          import pathlib, re, sys
          music, manga = map(pathlib.Path, sys.argv[1:])
          out = ["# COMICKO Integration Audit", "",
                 "This report maps the two source projects before merging them into one installable app.",
                 "It is an audit only; it does not claim that the combined app is already integrated.", ""]
          for label, root in [("Music (Velune)", music), ("Manga reader (Yōkai)", manga)]:
              out += [f"## {label}", "", f"- Project root: `{root}`"]
              for rel in ["settings.gradle.kts", "settings.gradle", "build.gradle.kts",
                          "build.gradle", "gradle/libs.versions.toml",
                          "gradle/androidx.versions.toml", "app/build.gradle.kts",
                          "app/build.gradle", "app/src/main/AndroidManifest.xml"]:
                  p = root / rel
                  if p.is_file():
                      text = p.read_text(errors="replace")
                      if rel.startswith("settings.gradle"):
                          lines = [x.strip() for x in text.splitlines()
                                   if re.search(r'include|project\(', x)]
                          out += [f"### {rel}", "", "```kotlin", *(lines[:100] or ["(no include declarations found)"]), "```", ""]
                      elif rel in ("app/build.gradle.kts", "app/build.gradle"):
                          lines = [x.strip() for x in text.splitlines()
                                   if re.search(r'namespace|applicationId|compileSdk|minSdk|targetSdk|alias\(', x)]
                          out += [f"### Key settings from {rel}", "", "```kotlin", *(lines[:100] or ["(no matching settings found)"]), "```", ""]
                      elif rel.endswith("AndroidManifest.xml"):
                          lines = [x.strip() for x in text.splitlines()
                                   if re.search(r'<manifest|package=|<application|<activity|<service|<provider|MAIN|LAUNCHER|foregroundServiceType', x)]
                          out += [f"### Manifest entry points", "", "```xml", *(lines[:120] or ["(no manifest entry points found)"]), "```", ""]
                      elif "versions.toml" in rel:
                          out += [f"- Version catalog present: `{rel}`"]
              modules = sorted(p.name for p in root.iterdir() if p.is_dir() and
                               (p / "build.gradle.kts").exists() or p.is_dir() and (p / "build.gradle").exists())
              out += [f"- Top-level Gradle modules: {', '.join(modules) if modules else '(see settings file)'}", ""]
          out += ["## Integration risks to resolve", "",
                  "- Align Gradle wrapper/AGP/Kotlin and version catalogs without silently downgrading dependencies.",
                  "- Merge manifest permissions, services, providers, deep links, and launch activities.",
                  "- Resolve duplicate resources, dependencies, package/namespace collisions, and app IDs.",
                  "- Wire the reader screen and music playback service into one navigation/activity host.",
                  "- Implement a floating player connected to the real playback session; do not substitute mock playback.",
                  "- Build and upload one final APK only after the merged app task succeeds.", ""]
          pathlib.Path("COMICKO-INTEGRATION-AUDIT.md").write_text("\n".join(out))
          PY

      - name: Upload integration audit report
        uses: actions/upload-artifact@v4
        with:
          name: comicko-integration-audit
          path: COMICKO-INTEGRATION-AUDIT.md
